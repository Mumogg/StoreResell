name: Sincronizar ventas

on:
  schedule:
    - cron: "17 13 * * *" # ≈ 7:17 a.m. Costa Rica
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ventas
  cancel-in-progress: false

jobs:
  ventas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sincronizar pedidos de Lemon Squeezy
        env:
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_STORE_ID: ${{ vars.LEMONSQUEEZY_STORE_ID }}
          LEMONSQUEEZY_TEST_MODE: ${{ vars.LEMONSQUEEZY_TEST_MODE }}
        run: node scripts/sincronizar-ventas.mjs

      - name: Validar datos
        run: node scripts/validar.mjs

      - name: Guardar cambios (commit del bot)
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: ventas sincronizadas [skip ci]"
          for intento in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rechazado (intento $intento); rebase y reintento…"
            git pull --rebase origin main
          done
          echo "::error::No se pudo hacer push después de 3 intentos."
          exit 1

  # Reutiliza el workflow de publicación para que el panel muestre las ventas nuevas.
  publicar:
    needs: ventas
    uses: ./.github/workflows/publicar.yml
    secrets: inherit
